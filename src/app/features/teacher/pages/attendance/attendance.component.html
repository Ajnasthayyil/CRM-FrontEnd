<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <div class="breadcrumbs">Home / Teacher / Attendance</div>
      <h1>Mark Attendance</h1>
      <div class="subtitle">Record student attendance for your classes</div>
    </div>
    <div class="header-right">
      <button class="btn-outline-sm" (click)="loadAttendanceData()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.25 4.28"/></svg> Reset
      </button>
      <button class="btn-primary-sm" (click)="saveAttendance()" [disabled]="isSaving">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        {{ isSaving ? 'Saving...' : 'Save Attendance' }}
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="search-bar" style="justify-content: flex-start; gap: 16px;">
    <div class="filter-group">
      <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: block; text-transform: uppercase;">Date</label>
      <input type="date" class="form-control" [ngModel]="selectedDate | date:'yyyy-MM-dd'" (ngModelChange)="selectedDate = $event; loadAttendanceData()">
    </div>

    <div class="filter-group">
      <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: block; text-transform: uppercase;">Class</label>
      <select class="form-control" [(ngModel)]="selectedClassId" (change)="onClassChange()">
        <option *ngFor="let cls of classes" [value]="cls.id">
          {{ cls.className }} - {{ cls.section }}
        </option>
      </select>
    </div>
    
    <div class="filter-group" style="margin-left: auto; display: flex; align-items: flex-end;">
      <div class="bulk-actions" style="display: flex; gap: 8px;">
        <button class="btn-outline-sm" (click)="markAll('Present')" style="color: #10b981; border-color: #10b981;">Mark All Present</button>
        <button class="btn-outline-sm block-btn" (click)="markAll('Absent')">Mark All Absent</button>
      </div>
    </div>
  </div>

  <div class="loading-shade" *ngIf="isLoading" style="padding: 20px; text-align: center; color: var(--text-muted);">
    <p>Loading attendance data...</p>
  </div>

  <div class="table-container" *ngIf="!isLoading">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width: 100px;">ROLL NO.</th>
          <th>STUDENT NAME</th>
          <th>ATTENDANCE STATUS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let record of attendanceRecords">
          <td style="font-weight: 500;">{{ record.rollNumber }}</td>
          <td>
            <div class="name-cell">
              <strong style="color: var(--text-main);">{{ record.studentName }}</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">{{ record.studentId }}</div>
            </div>
          </td>
          <td>
            <div class="status-toggle-group">
              <button class="status-btn" [class.active-present]="record.status === 'Present'" (click)="record.status = 'Present'">Present</button>
              <button class="status-btn" [class.active-absent]="record.status === 'Absent'" (click)="record.status = 'Absent'">Absent</button>
              <button class="status-btn" [class.active-late]="record.status === 'Late'" (click)="record.status = 'Late'">Late</button>
              <button class="status-btn" [class.active-leave]="record.status === 'Leave'" (click)="record.status = 'Leave'">Leave</button>
            </div>
          </td>
        </tr>
        
        <tr *ngIf="attendanceRecords.length === 0">
          <td colspan="3" style="text-align: center; padding: 30px; color: var(--text-muted);">
            No students found for this class.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
