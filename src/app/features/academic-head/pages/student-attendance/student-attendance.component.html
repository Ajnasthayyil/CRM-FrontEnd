<div class="page-container">
  <app-department-header></app-department-header>

  <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h2>Mark Student Attendance</h2>
    <div style="font-weight: 500; background: var(--bg-main); padding: 8px 16px; border-radius: 8px;">Date: {{ today }}</div>
  </div>

  <div class="card" style="background: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color);">
    <table class="data-table" style="width: 100%; text-align: left; border-collapse: collapse; margin-bottom: 24px;">
      <thead>
        <tr style="border-bottom: 1px solid var(--border-color);">
          <th style="padding: 12px 8px;">Student</th>
          <th style="padding: 12px 8px;">Class / Section</th>
          <th style="padding: 12px 8px;">Mark Attendance</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students" style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 12px 8px; font-weight: 500;">{{ s.name }}</td>
          <td style="padding: 12px 8px;">{{ s.className }} (Sec {{ s.section }})</td>
          <td style="padding: 12px 8px;">
            <select [(ngModel)]="s.currentMark" class="form-control" style="width: auto;">
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Leave">Leave</option>
              <option value="Late">Late</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>

    <div style="display: flex; justify-content: flex-end;">
      <button class="btn-primary" (click)="submitAttendance()">Submit Attendance</button>
    </div>
  </div>
</div>
