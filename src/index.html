<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CrmFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <div id="error-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,0,0,0.8); color:white; z-index:999999; display:none; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto;"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      var overlay = document.getElementById('error-overlay');
      overlay.style.display = 'block';
      overlay.innerHTML += 'Error: ' + message + '\nSource: ' + source + ':' + lineno + ':' + colno + '\n' + (error && error.stack ? error.stack : '') + '\n\n';
    };
    window.addEventListener('unhandledrejection', function(event) {
      var overlay = document.getElementById('error-overlay');
      overlay.style.display = 'block';
      overlay.innerHTML += 'Unhandled Promise Rejection: ' + event.reason + '\n\n';
    });
  </script>
  <app-root></app-root>
</body>
</html>
